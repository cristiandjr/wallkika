[package]
name = "wallkika"
version = "0.2.0"
description = "Image, GIF, video or HTML wallpapers mirrored on every screen"
authors = ["cristiandjr"]
license = "MIT"
repository = "https://github.com/cristiandjr/WallKika"
edition = "2021"

[lib]
# The "_lib" suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "wallkika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Never use panic = "abort": wry catches WebKit exceptions from cancelled media requests and needs unwinding.
strip = "debuginfo"
